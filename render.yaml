services:
  - type: web
    name: ocayork-map
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: off
    buildCommand: npm install && bash install-unmined.sh
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REALM_ID
        value: "33911323"
      - key: UPDATE_INTERVAL_MINUTES
        value: "60"
      - key: ZOOM_IN
        value: "2"
      - key: ZOOM_OUT
        value: "10"
      - key: CLIENT_EXTRA_ZOOM
        value: "4"
      - key: UNMINED_CHUNK_PROCESSORS
        value: "1"
      - key: UNMINED_GC_HEAP_LIMIT
        value: "10000000"
      - key: TILE_CACHE_SECONDS
        value: "600"
      - key: ASSET_CACHE_SECONDS
        value: "3600"
      - key: REFRESH_TOKEN
        sync: false
      - key: AUTH_CACHE_ZIP_BASE64
        sync: false
